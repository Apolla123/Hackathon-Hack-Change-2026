<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>МТС Energytool: ИИ-консультант</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1c1f26; --muted:#6b7280; --line:#e3e6eb; --red:#e30611; --soft:#f0f1f4; --ok:#15803d; --warn:#b45309; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --card:#1d2026; --text:#eceef2; --muted:#9aa1ad; --line:#2d313a; --soft:#262a31; --ok:#5fd48a; --warn:#f0b45a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; flex:1; min-width:200px; }
  header h1 b { color:var(--red); }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); padding:7px 12px; }
  button.primary { background:var(--red); border-color:var(--red); color:#fff; }
  button:disabled { opacity:.55; cursor:wait; }
  label.dbg { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--muted); cursor:pointer; }
  .wrap { flex:1; display:grid; grid-template-columns:minmax(0,1fr) 340px; min-height:0; }
  body.embed .wrap { grid-template-columns:1fr; } body.embed aside, body.embed header .nav { display:none; }
  @media (max-width:860px) { .wrap { grid-template-columns:1fr; } aside { display:none; } aside.show { display:block; position:fixed; inset:56px 0 0 0; z-index:5; } }
  .chat { display:flex; flex-direction:column; min-height:0; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:min(680px,88%); padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.user { align-self:flex-end; background:var(--red); color:#fff; border-bottom-right-radius:4px; }
  .msg.bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .msg.sys { align-self:center; font-size:13px; color:var(--muted); background:transparent; }
  .dbg-box { display:none; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--muted); white-space:normal; }
  body.debug .dbg-box { display:block; }
  .dbg-box .row { margin:2px 0; } .dbg-box .chunk { margin:4px 0; padding:4px 8px; background:var(--soft); border-radius:6px; }
  .dbg-box .used { border-left:3px solid var(--ok); } .dbg-box .warn { color:var(--warn); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; padding:0 16px 8px; }
  .chips button { font-size:14px; border-radius:999px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--card); }
  textarea { flex:1; resize:none; font:inherit; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); max-height:120px; }
  aside { border-left:1px solid var(--line); background:var(--card); overflow-y:auto; padding:12px; }
  aside h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:14px 0 6px; }
  .item { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:14px; cursor:pointer; }
  .item:hover, .item.active { border-color:var(--red); } .item small { color:var(--muted); display:block; }
  .lead { cursor:default; white-space:pre-wrap; } .tag { font-size:11px; padding:1px 7px; border-radius:6px; background:var(--soft); color:var(--muted); margin-left:4px; }
  .tag.ok { color:var(--ok); }
</style>
</head>
<body>
<header>
  <h1><b>МТС Energytool</b> · ИИ-консультант</h1>
  <label class="dbg"><input type="checkbox" id="dbgToggle"> Режим отладки</label>
  <button class="nav" id="histBtn">История</button>
  <button class="primary" id="newBtn">Новый диалог</button>
</header>
<div class="wrap">
  <section class="chat">
    <div id="log" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form id="form">
      <textarea id="input" rows="1" maxlength="2000" placeholder="Опишите свою задачу: например, «выросли счета за свет»"></textarea>
      <button class="primary" id="send" type="submit">Отправить</button>
    </form>
  </section>
  <aside id="side">
    <h2>Сессии</h2><div id="sessions"></div>
    <h2>Заявки менеджерам</h2><div id="leads"></div>
  </aside>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send");
if (new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");
let sessionId = localStorage.getItem("et_session") || null;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function scroll() { log.scrollTop = log.scrollHeight; }

function debugBox(d) {                       // все данные вставляются через textContent: XSS невозможен
  const box = el("div", "dbg-box");
  if (!d) return box;
  const line = (t, c) => box.appendChild(el("div", "row " + (c || ""), t));
  line(`⏱ всего ${d.total_ms ?? "?"} мс · поиск ${d.retrieval_ms ?? "?"} мс · модель ${d.llm_ms ?? "—"} мс`);
  line(`🔎 поиск: ${d.search_mode}, уверенность ${d.confidence}${d.low_confidence ? " (низкая)" : ""} · запрос: ${d.query}`);
  if (d.lead_stage) line(`📝 этап заявки: ${d.lead_stage}`);
  (d.chunks || []).forEach(c => {
    const used = (d.used_chunks || []).includes(c.id);
    const ch = el("div", "chunk" + (used ? " used" : ""));
    ch.appendChild(el("b", "", `${used ? "✔ использован" : "найден"}: ${c.title} `));
    ch.appendChild(el("span", "", `[${c.id}] bm25=${c.bm25} cov=${c.coverage}${c.dense != null ? " dense=" + c.dense : ""}`));
    ch.appendChild(el("div", "", c.snippet));
    box.appendChild(ch);
  });
  (d.warnings || []).forEach(w => line("⚠ " + w, "warn"));
  if (d.llm_error) line("⚠ ошибка модели: " + d.llm_error, "warn");
  return box;
}

function addMsg(role, text, debug) {
  const m = el("div", "msg " + (role === "user" ? "user" : "bot"));
  m.appendChild(document.createTextNode(text));
  if (role !== "user") m.appendChild(debugBox(debug));
  log.appendChild(m); scroll(); return m;
}

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : undefined);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Ошибка сервера");
  return data;
}

function greet() {
  log.textContent = "";
  addMsg("bot", "Здравствуйте! Я консультант МТС Energytool. Расскажите своими словами, какую задачу с электроэнергией вы хотите решить: снизить расходы, наладить учёт или найти потери. Подберу подходящее решение.");
  const chips = $("chips"); chips.textContent = "";
  ["Выросли счета за электричество", "Нужны счётчики для СНТ", "Как найти хищения электроэнергии?"].forEach(t => {
    const b = el("button", "", t); b.type = "button"; b.onclick = () => { input.value = t; $("form").requestSubmit(); }; chips.appendChild(b);
  });
}

async function submit(e) {
  e.preventDefault();
  const text = input.value.trim(); if (!text) return;
  input.value = ""; $("chips").textContent = ""; send.disabled = true;
  addMsg("user", text);
  const wait = addMsg("bot", "печатает…");
  try {
    const t0 = performance.now();
    const res = await api("/api/chat", { session_id: sessionId, message: text });
    sessionId = res.session_id; localStorage.setItem("et_session", sessionId);
    res.debug.client_ms = Math.round(performance.now() - t0);
    wait.remove(); addMsg("bot", res.reply, res.debug);
    if (res.lead_id) addMsg("sys", "✅ Заявка " + res.lead_id + " сформирована");
    refreshSide();
  } catch (err) { wait.remove(); addMsg("sys", "⚠ " + err.message); }
  send.disabled = false; input.focus();
}

async function newDialog() {            // полный сброс контекста: новая сессия, старая остаётся в истории
  const r = await api("/api/session/new", {});
  sessionId = r.session_id; localStorage.setItem("et_session", sessionId);
  greet(); refreshSide();
}

async function openSession(id) {
  const s = await api("/api/sessions/" + id);
  log.textContent = "";
  s.messages.forEach(m => addMsg(m.role, m.content, m.debug));
  addMsg("sys", "Просмотр сессии " + id + (id === sessionId ? " (текущая)" : " — только чтение. «Новый диалог» начнёт чистый лист"));
  if (id === sessionId) { /* можно продолжать */ } else { sessionId = null; localStorage.removeItem("et_session"); }
}

async function refreshSide() {
  try {
    const [ss, ls] = await Promise.all([api("/api/sessions"), api("/api/leads")]);
    const box = $("sessions"); box.textContent = "";
    ss.slice(0, 40).forEach(s => {
      const d = el("div", "item" + (s.id === sessionId ? " active" : ""));
      d.appendChild(el("span", "", (s.first_question || "(пустая сессия)").slice(0, 60)));
      if (s.lead_id) d.appendChild(el("span", "tag ok", "заявка"));
      d.appendChild(el("small", "", new Date(s.updated_at * 1000).toLocaleString("ru-RU") + " · сообщений: " + s.messages));
      d.onclick = () => openSession(s.id); box.appendChild(d);
    });
    const lb = $("leads"); lb.textContent = "";
    if (!ls.length) lb.appendChild(el("small", "", "Пока нет заявок"));
    ls.forEach(l => {
      const d = el("div", "item lead");
      d.appendChild(el("b", "", l.id + " · " + l.company)); d.appendChild(el("span", "tag", l.summary_source === "llm" ? "резюме ИИ" : "шаблон"));
      d.appendChild(el("small", "", l.name + ", " + l.phone));
      d.appendChild(el("div", "", l.summary)); lb.appendChild(d);
    });
  } catch (e) { /* боковая панель не критична */ }
}

$("form").addEventListener("submit", submit);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
$("newBtn").onclick = newDialog;
$("histBtn").onclick = () => $("side").classList.toggle("show");
$("dbgToggle").checked = localStorage.getItem("et_debug") === "1";
document.body.classList.toggle("debug", $("dbgToggle").checked);
$("dbgToggle").onchange = e => { document.body.classList.toggle("debug", e.target.checked); localStorage.setItem("et_debug", e.target.checked ? "1" : "0"); };

(async () => {
  if (sessionId) { try { const s = await api("/api/sessions/" + sessionId); if (s.messages.length) { await openSession(sessionId); } else greet(); } catch { sessionId = null; greet(); } }
  else greet();
  refreshSide();
})();
</script>
</body>
</html>
